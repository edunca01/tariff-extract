repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # demo PDFs are allowed; the full corpus is a release asset
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, chore, docs, ci, refactor, test, perf, data, eval]
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: reject AI attribution trailers in commit message
        entry: scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]
      - id: no-test-split-in-prompt-work
        name: block committing test-split gold labels alongside prompt changes
        entry: scripts/check-split-discipline.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

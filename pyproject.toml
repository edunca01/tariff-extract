[project]
name = "tariff-extract"
version = "0.1.0"
description = "LLM extraction of US utility residential tariff PDFs into URDB-shaped JSON, evaluated by bill impact against a hand-verified gold set"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Eugen Duncea" }]
dependencies = [
  "anthropic>=1.0",
  "ollama>=0.4",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "httpx>=0.27",
  "typer>=0.12",
  "polars>=1.0",
  "rapidfuzz>=3.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
report = [
  "matplotlib>=3.9",
]

[project.scripts]
tariff = "tariff_extract.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_extract"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".claude", "docs", "corpus", "labels", "cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "T20"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415", "E501"]
"scripts/**" = ["T201"]
"src/tariff_extract/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "dotenv", "rapidfuzz.*", "matplotlib.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "llm: calls a real LLM API; needs ANTHROPIC_API_KEY (never run in CI)",
  "network: hits OpenEI or utility websites (never run in CI)",
]

[tool.coverage.run]
source = ["src/tariff_extract"]
